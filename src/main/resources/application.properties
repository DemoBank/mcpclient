server.port=8181
spring.application.name=mcpclient
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Controller endpoint mappings
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# Spring component scanning
logging.level.org.springframework.context.annotation.ClassPathBeanDefinitionScanner=DEBUG

spring.ai.mcp.client.stdio.servers-configuration=classpath:mcp-server.json


